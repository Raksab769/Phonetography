:root {
  --text-xs:       0.75rem;

  --text-lg:       1.125rem;
  --text-xl:       1.25rem;
  --text-2xl:      1.5rem;
  --text-3xl:      1.875rem;
  --text-4xl:      2.25rem;
  --text-display:  3.5rem;
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --duration-slow: 400ms;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-base);

  letter-spacing: 0.01em;

}

}

<style>
/* Fix hero alignment on iPhone */
.hero {
  /* include safe-area inset so content doesn't shift under notch on iPhone */
  padding-top: calc(var(--nav-height) + env(safe-area-inset-top));
}

/* Make image container a centered flexbox so focal point stays centered */
.hero-image-col {
  display: flex;
  align-items: center;
  justify-content: center;
  /* ensure it forms a predictable box on small screens */
  height: auto;
}

/* Ensure the image always covers and centers reliably on Safari/iOS */
.hero-image-col img {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
  object-position: center center; /* <-- main fix for alignment */
  -webkit-transform: translateZ(0); /* force GPU compositing on some iOS versions */
}
@media (max-width: 900px) {
  /* avoid a rigid vw height that can mis-position the image on some iPhones */
  .hero-image-col {
    height: clamp(260px, 55vw, 60vh);
  }
}
</style>

/* Asymmetric editorial grid */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: auto;
  gap: 1.25rem;
}

.p-card {
  position: relative;
  overflow: hidden;
  background-color: var(--surface);
  cursor: default;
}

.p-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform var(--duration-slow) ease, filter var(--duration-slow) ease;
}

.p-card:hover img {
  transform: scale(1.04);
  filter: brightness(0.75);
}

.p-card-caption {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 1.5rem;
  background: linear-gradient(to top, color-mix(in srgb, var(--bg) 85%, transparent), transparent);
  transform: translateY(0.5rem);
  opacity: 0;
  transition: opacity var(--duration-base) ease, transform var(--duration-base) ease;
}

.p-card:hover .p-card-caption {
  opacity: 1;
  transform: translateY(0);
}

.p-card-caption h3 {
  font-size: var(--text-lg);
  font-weight: 400;
  color: var(--text);
  margin-bottom: 0.25rem;

.p-card-caption span {
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}

/* Grid placement — editorial asymmetry */
.p-card-1 { grid-column: 1 / 8;  grid-row: 1; aspect-ratio: 3/2; }
.p-card-2 { grid-column: 8 / 13; grid-row: 1; aspect-ratio: 4/5; }
.p-card-3 { grid-column: 1 / 5;  grid-row: 2; aspect-ratio: 4/5; }
.p-card-4 { grid-column: 5 / 9;  grid-row: 2; aspect-ratio: 1/1; }
.p-card-5 { grid-column: 9 / 13; grid-row: 2; aspect-ratio: 4/3; }

@media (max-width: 900px) {
  .portfolio-grid {
    grid-template-columns: 1fr 1fr;
  }
  .p-card-1,
  .p-card-2,
  .p-card-3,
  .p-card-4,
  .p-card-5 {
    grid-column: auto;
    grid-row: auto;
    aspect-ratio: 4/3;
  }
}

@media (max-width: 600px) {
  .portfolio-grid {
    grid-template-columns: 1fr;
  }
  .p-card-2, .p-card-4 { aspect-ratio: 4/3; }

  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 0.2rem;
}

.channel-value {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 500;
  color: var(--text);
}

.contact-right {
  padding-top: 1rem;
}

.contact-availability {
  background-color: var(--surface);
  border: 1px solid var(--border);
  padding: 2.5rem;
  margin-bottom: 2.5rem;
}

.avail-status {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.avail-dot {
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background-color: #4caf82;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

.avail-dot { animation: pulse 2.2s ease-in-out infinite; }

.avail-label {
  font-size: var(--text-xs);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg);
}

.contact-availability h3 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 400;
  color: var(--text);
  margin-bottom: 1rem;
}

.contact-availability p {
  font-size: var(--text-sm);
  color: var(--fg);
  line-height: 1.7;
}

.btn-contact {
  display: block;
  width: 100%;
  text-align: center;
  background-color: var(--primary);
  color: var(--text-on-accent);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 1.1rem 2rem;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: background-color var(--duration-fast) ease, transform var(--duration-fast) ease;
  min-height: 24px;
}

.btn-contact:hover {
  background-color: var(--link-hover);
  color: var(--text-on-accent);
}

.btn-contact:active { transform: scale(0.98); }

@media (max-width: 800px) {
  .contact-grid { grid-template-columns: 1fr; }
}
